id = "kiln"
name = "Kiln"
version = "0.1.0"
schema_version = 1
description = "Kiln templates: highlighting, formatting, errors as you type, completions and go to definition."
authors = ["William Yallop <hello@williamyallop.com>"]
repository = "https://github.com/buildlucid/kiln"
snippets = ["./snippets/kiln.json"]

# Installed from npm, or taken from the project's node_modules. See src/lib.rs.
[language_servers.kiln]
name = "Kiln Language Server"
languages = ["Kiln"]

# The grammar lives in this repository, under packages/tree-sitter-kiln.
# For local development, `repository` can point at a checkout, such as "file:///path/to/kiln",
# but `rev` must still be a committed sha, since Zed checks out that revision.
[grammars.kiln]
repository = "https://github.com/buildlucid/kiln"
rev = "TODO-commit-sha"
path = "packages/tree-sitter-kiln"
