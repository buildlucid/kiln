id = "kiln"
name = "Kiln"
version = "0.1.0"
schema_version = 1
description = "Kiln templates: highlighting, formatting, errors as you type, completions and go to definition."
authors = ["William Yallop <hello@williamyallop.com>"]
repository = "https://github.com/buildlucid/kiln"
snippets = ["./snippets/kiln.json"]

# Installed from npm, or taken from the project's node_modules. See src/lib.rs.
[language_servers.kiln]
name = "Kiln Language Server"
languages = ["Kiln"]

# The grammar lives in this repository, under packages/tree-sitter-kiln. `rev` must be a committed sha, since Zed
# checks out that revision. While developing, `repository` points at a local checkout; switch it back to
# "https://github.com/buildlucid/kiln" with a pushed sha before publishing.
[grammars.kiln]
repository = "file:///Users/williamyallop/Documents/projects/protodigital/internal/kiln"
rev = "c668fa8e7c5d783b2fc52ef15bcd1b02dbbb1db6"
path = "packages/tree-sitter-kiln"
